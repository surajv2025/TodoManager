{% extends "base.html" %}
{% block title %}Edit Task{% endblock title %}
{% block content %}
    <div class="container">
        {% if task_obj.owner == request.user %}
        <form method="post">
            {% csrf_token %}   
            <div class="mb-3">
                <input type="text" class="form-control" name="task" placeholder='{{task_obj.task}}', value='{{task_obj.task}}'>
                <input type="hidden" name="is_completed" value='{{task_obj.is_completed}}'>
            </div>
  
            <button type="submit" class="btn btn-primary">UpdateTask</button>
        </form>
    {% else %}
        <p>You are not the owner of this task.</p>
    {% endif %}
    <div>
{% endblock content%}
